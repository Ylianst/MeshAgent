name: openssl-armada370-hf
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha256:
        required: true
        type: string
      force:
        required: true
        type: boolean
      version_suffix:
        required: false
        default: false
        type: boolean

env:
  OSSL_FLAGS: >-
    no-weak-ssl-ciphers no-srp no-psk no-comp no-zlib no-zlib-dynamic
    no-hw no-dso no-shared -no-asm no-rc5 no-idea no-md4
    no-rmd160 no-ssl no-ssl3 no-seed no-camellia no-bf no-cast no-md2
    no-mdc2 no-engine no-ocsp no-cms

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Set (to -<version>) writes this run's archives beside the committed ones
      # instead of overwriting them, so several versions can coexist.
      SFX: ${{ inputs.version_suffix && format('-{0}', inputs.version) || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the archive already matches the requested version
        id: check
        run: |
          f="openssl/libstatic/linux/linux-armada370-hf/libcrypto${SFX}.a"
          skip=false
          if [ -f "$f" ] && strings "$f" | grep -qF "OpenSSL ${{ inputs.version }} "; then
            skip=true
          fi
          [ "${{ inputs.force }}" = "true" ] && skip=false
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          [ "$skip" = "true" ] && echo "::notice::linux-armada370-hf already at OpenSSL ${{ inputs.version }} and force=false - skipping rebuild."
          true
      # dd-wrt's 4.2GB toolchain archive; only arm_cortex-a9 musl is needed.
      # The server aborts mid-transfer very often, so this resumes, not restarts.
      # TODO: the needed includes are just 2MB (410KB packed), maybe add through tags or other repo
      - name: Download dd-wrt toolchain (arm_cortex-a9 musl)
        if: steps.check.outputs.skip != 'true'
        run: |
          for i in $(seq 1 50); do
            curl --http1.1 -sS -C - --connect-timeout 20 --max-time 300 -o toolchains.tar.xz \
              https://download1.dd-wrt.com/dd-wrtv2/downloads/toolchains/toolchains.tar.xz && break
          done
          tar xf toolchains.tar.xz toolchain-arm_cortex-a9_gcc-15.2.0_musl_eabi
      - name: Download and verify source
        if: steps.check.outputs.skip != 'true'
        run: |
          # 1.x releases are tagged OpenSSL_1_1_1w; 3.x and later, openssl-3.5.7.
          case "${{ inputs.version }}" in
            1.*) tag="OpenSSL_$(echo "${{ inputs.version }}" | tr . _)" ;;
            *)   tag="openssl-${{ inputs.version }}" ;;
          esac
          curl -sSL -o ossl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/$tag/openssl-${{ inputs.version }}.tar.gz"
          echo "${{ inputs.sha256 }}  ossl.tar.gz" | sha256sum -c -
          mkdir src && tar xzf ossl.tar.gz -C src --strip-components=1
      - name: Build linux-armada370-hf (musl, -Os, no-asm - linux-armv4 asm broke crypto correctness on this Configure target)
        if: steps.check.outputs.skip != 'true'
        run: |
          cd src
          tc="$GITHUB_WORKSPACE/toolchain-arm_cortex-a9_gcc-15.2.0_musl_eabi"
          CC="$tc/bin/arm-openwrt-linux-muslgnueabi-gcc" ./Configure linux-armv4 $OSSL_FLAGS
          sed -i 's/ -O3 / -Os /g' Makefile
          # build_libs only: this repo ships just the two archives, and 3.x's
          # apps/fuzz link pulls 64-bit atomics that 32-bit targets lack.
          make -j"$(nproc)" build_libs
      - name: Verify version and target architecture
        if: steps.check.outputs.skip != 'true'
        run: |
          cd src
          v=$(strings libcrypto.a | grep -oE 'OpenSSL [0-9]+\.[0-9]+\.[0-9]+[a-z]?' | sort -u | tr '\n' ' ')
          echo "version: $v"
          strings libcrypto.a | grep -qF "OpenSSL ${{ inputs.version }} "
          obj=$(ar t libcrypto.a | grep -m1 '\.o$')
          mkdir -p /tmp/probe && cd /tmp/probe && ar x "$GITHUB_WORKSPACE/src/libcrypto.a" "$obj"
          file "$obj"
          if file "$obj" | grep -q 'x86-64'; then
            echo "ERROR: linux-armada370-hf archive contains host x86-64 objects" >&2
            exit 1
          fi
      - name: Stage repo layout
        if: steps.check.outputs.skip != 'true'
        run: |
          d=out/openssl/libstatic/linux/linux-armada370-hf
          mkdir -p "$d"
          cp src/libcrypto.a "$d/libcrypto${SFX}.a"
          cp src/libssl.a "$d/libssl${SFX}.a"
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ steps.check.outputs.skip != 'true' }}
        with:
          name: openssl-linux-armada370-hf
          path: out/
