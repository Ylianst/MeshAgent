name: openssl-linux-cross
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha256:
        required: true
        type: string
      force:
        required: true
        type: boolean
      version_suffix:
        required: false
        default: false
        type: boolean

env:
  OSSL_FLAGS: >-
    no-weak-ssl-ciphers no-srp no-psk no-comp no-zlib no-zlib-dynamic
    no-hw no-dso no-shared -no-asm no-rc5 no-idea no-md4
    no-rmd160 no-ssl no-ssl3 no-seed no-camellia no-bf no-cast no-md2
    no-mdc2 no-engine no-ocsp no-cms

# (arm2 removed, armhf2 now symlinks to armhf - see targets.sh)
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Set (to -<version>) writes this run's archives beside the committed ones
      # instead of overwriting them, so several versions can coexist.
      SFX: ${{ inputs.version_suffix && format('-{0}', inputs.version) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # extra: enable-ec_nistp_64_gcc_128 needs GCC __int128, so it's only set on genuinely 64-bit targets.
          # asm: "1" drops -no-asm - only set where the target actually has an asm module.
          - { dir: aarch64,            target: linux-aarch64,   cc: aarch64-linux-gnu-gcc, pkg: gcc-aarch64-linux-gnu, extra: "enable-ec_nistp_64_gcc_128", asm: "1" }
          - { dir: arm64,              target: linux-aarch64,   cc: aarch64-linux-gnu-gcc, pkg: gcc-aarch64-linux-gnu, extra: "enable-ec_nistp_64_gcc_128", asm: "1" }
          - { dir: aarch64-cortex-a53, target: linux-aarch64,   cc: aarch64-linux-gnu-gcc, pkg: gcc-aarch64-linux-gnu, cflags: "-mcpu=cortex-a53", extra: "enable-ec_nistp_64_gcc_128", asm: "1" }
          - { dir: armhf,              target: linux-armv4,     cc: arm-linux-gnueabihf-gcc, pkg: gcc-arm-linux-gnueabihf, asm: "1" }
          - { dir: arm-linaro,         target: linux-generic32, cc: arm-linux-gnueabihf-gcc, pkg: gcc-arm-linux-gnueabihf }
          - { dir: arm,                target: linux-generic32, cc: arm-linux-gnueabi-gcc, pkg: gcc-arm-linux-gnueabi }
          # pogo (PogoPlug, ARMv5TE softfloat): same toolchain as arm above - apt's
          # arm-linux-gnueabi-gcc defaults to exactly the ABI real PogoPlug hardware needs.
          - { dir: pogo,               target: linux-generic32, cc: arm-linux-gnueabi-gcc, pkg: gcc-arm-linux-gnueabi }
          - { dir: mips,               target: linux-generic32, cc: mips-linux-gnu-gcc, pkg: gcc-mips-linux-gnu }
          - { dir: mipsel,             target: linux-mips32,    cc: mipsel-linux-gnu-gcc, pkg: gcc-mipsel-linux-gnu, asm: "1" }
          - { dir: riscv64,            target: linux64-riscv64, cc: riscv64-linux-gnu-gcc, pkg: gcc-riscv64-linux-gnu, extra: "enable-ec_nistp_64_gcc_128" }
          - { dir: riscv64-generic,    target: linux-generic64, cc: riscv64-linux-gnu-gcc, pkg: gcc-riscv64-linux-gnu, cflags: "-march=rv64gc -mabi=lp64d", extra: "enable-ec_nistp_64_gcc_128" }
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the archive already matches the requested version
        id: check
        run: |
          f="openssl/libstatic/linux/${{ matrix.dir }}/libcrypto${SFX}.a"
          skip=false
          if [ -f "$f" ] && strings "$f" | grep -qF "OpenSSL ${{ inputs.version }} "; then
            skip=true
          fi
          [ "${{ inputs.force }}" = "true" ] && skip=false
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          [ "$skip" = "true" ] && echo "::notice::${{ matrix.dir }} already at OpenSSL ${{ inputs.version }} and force=false - skipping rebuild."
          true
      - name: Install cross toolchain
        if: steps.check.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}
      - name: Download and verify source
        if: steps.check.outputs.skip != 'true'
        run: |
          # 1.x releases are tagged OpenSSL_1_1_1w; 3.x and later, openssl-3.5.7.
          case "${{ inputs.version }}" in
            1.*) tag="OpenSSL_$(echo "${{ inputs.version }}" | tr . _)" ;;
            *)   tag="openssl-${{ inputs.version }}" ;;
          esac
          curl -sSL -o ossl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/$tag/openssl-${{ inputs.version }}.tar.gz"
          echo "${{ inputs.sha256 }}  ossl.tar.gz" | sha256sum -c -
          mkdir src && tar xzf ossl.tar.gz -C src --strip-components=1
      - name: Build ${{ matrix.dir }} (-Os, embedded targets are flash constrained)
        if: steps.check.outputs.skip != 'true'
        run: |
          cd src
          flags="$OSSL_FLAGS"
          [ -n "${{ matrix.asm }}" ] && flags="${flags/-no-asm/}"
          CC="${{ matrix.cc }} ${{ matrix.cflags }}" ./Configure ${{ matrix.target }} $flags ${{ matrix.extra }}
          sed -i 's/ -O3 / -Os /g' Makefile
          # build_libs only: this repo ships just the two archives, and 3.x's
          # apps/fuzz link pulls 64-bit atomics that 32-bit targets lack.
          make -j"$(nproc)" build_libs
      - name: Verify version and target architecture
        if: steps.check.outputs.skip != 'true'
        run: |
          cd src
          v=$(strings libcrypto.a | grep -oE 'OpenSSL [0-9]+\.[0-9]+\.[0-9]+[a-z]?' | sort -u | tr '\n' ' ')
          echo "version: $v"
          strings libcrypto.a | grep -qF "OpenSSL ${{ inputs.version }} "
          # Guard against Configure silently falling back to the host compiler.
          obj=$(ar t libcrypto.a | grep -m1 '\.o$')
          mkdir -p /tmp/probe && cd /tmp/probe && ar x "$GITHUB_WORKSPACE/src/libcrypto.a" "$obj"
          file "$obj"
          if file "$obj" | grep -q 'x86-64'; then
            echo "ERROR: ${{ matrix.dir }} archive contains host x86-64 objects" >&2
            exit 1
          fi
      - name: Stage repo layout
        if: steps.check.outputs.skip != 'true'
        run: |
          d="out/openssl/libstatic/linux/${{ matrix.dir }}"
          mkdir -p "$d"
          cp src/libcrypto.a "$d/libcrypto${SFX}.a"
          cp src/libssl.a "$d/libssl${SFX}.a"
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ steps.check.outputs.skip != 'true' }}
        with:
          name: openssl-linux-${{ matrix.dir }}
          path: out/
