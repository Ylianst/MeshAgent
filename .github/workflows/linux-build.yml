name: Linux Build
run-name: Build Linux versions of MeshAgent
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  linux-build-x86:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.0
      - name: Install Packages
        run: |
          sudo dpkg --add-architecture i386 &&
          sudo apt clean all && sudo apt update && 
          sudo apt-get install -y libx11-dev libxtst-dev libxext-dev libjpeg62-dev build-essential musl-tools &&
          sudo apt-get install -y linux-libc-dev:i386 libc6-dev-i386 libjpeg62-dev:i386 &&
          sudo apt-get install -y libc6-armel-cross libc6-dev-armel-cross binutils-arm-linux-gnueabi libncurses5-dev gcc-arm-linux-gnueabihf &&
          sudo apt-get install -y libxrandr-dev libwayland-dev libdrm-dev libegl-dev libgles-dev
      # -march=x86-64 in BOOTLIN_CC64 because Bootlin's x86-64 toolchain defaults to -march=corei7
      # -idirafter for the proper searchpath order
      - name: Install Bootlin x86 glibc 2.27 toolchains
        run: |
          curl -fsSL https://toolchains.bootlin.com/downloads/releases/toolchains/x86-i686/tarballs/x86-i686--glibc--stable-2018.11-1.tar.bz2 | tar -xj -C "$RUNNER_TEMP" &&
          curl -fsSL https://toolchains.bootlin.com/downloads/releases/toolchains/x86-64-core-i7/tarballs/x86-64-core-i7--glibc--stable-2018.11-1.tar.bz2 | tar -xj -C "$RUNNER_TEMP" &&
          echo "BOOTLIN_CC32=$RUNNER_TEMP/x86-i686--glibc--stable-2018.11-1/bin/i686-linux-gcc -idirafter /usr/include/i386-linux-gnu -idirafter /usr/include" >> "$GITHUB_ENV" &&
          echo "BOOTLIN_CC64=$RUNNER_TEMP/x86-64-core-i7--glibc--stable-2018.11-1/bin/x86_64-linux-gcc -march=x86-64 -mtune=generic -idirafter /usr/include/x86_64-linux-gnu -idirafter /usr/include" >> "$GITHUB_ENV"
      - name: Build 32 Bit Linux
        run: make -j4 linux ARCHID=5 CC="$BOOTLIN_CC32" && make clean
      - name: Build 64 Bit Linux
        run: make -j4 linux ARCHID=6 CC="$BOOTLIN_CC64" && make clean
      - name: Build 32 Bit NOKVM Linux
        run: make -j4 linux ARCHID=19 CC="$BOOTLIN_CC32" && make clean
      - name: Build 64 Bit NOKVM Linux
        run: make -j4 linux ARCHID=20 CC="$BOOTLIN_CC64" && make clean
      - name: Build 64 Bit Alpine Linux
        run: make -j4 linux ARCHID=33 && make clean
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: meshagent-binaries-x86
          path: ${{ github.workspace }}/meshagent_*

  linux-build-arm:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.0
      - name: Install Packages
        run: |
          sudo apt clean all && sudo apt update &&
          sudo apt-get install -y libx11-dev libxtst-dev libxext-dev libxrandr-dev libwayland-dev libdrm-dev libegl-dev libgles-dev
      - name: Install Bootlin aarch64 glibc 2.27 toolchain
        run: |
          curl -fsSL https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--stable-2018.11-1.tar.bz2 | tar -xj -C "$RUNNER_TEMP" &&
          echo "$RUNNER_TEMP/aarch64--glibc--stable-2018.11-1/aarch64-buildroot-linux-gnu/bin" >> "$GITHUB_PATH" &&
          echo "BOOTLIN_CC=$RUNNER_TEMP/aarch64--glibc--stable-2018.11-1/bin/aarch64-linux-gcc -idirafter $GITHUB_WORKSPACE/lib-jpeg-turbo/includes -idirafter /usr/include" >> "$GITHUB_ENV"
      - name: Build ARM64 Linux
        run: make -j4 linux ARCHID=26 CC="$BOOTLIN_CC" && make clean
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: meshagent-binaries-arm
          path: ${{ github.workspace }}/meshagent_*

  linux-build-aarch64-glibc:
    name: aarch64 glibc (ARCHID=32, meshagent_aarch64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.0
      - name: Install Packages
        run: |
          sudo apt clean all && sudo apt update &&
          sudo apt-get install -y libx11-dev libxtst-dev libxext-dev libxrandr-dev libwayland-dev libdrm-dev libegl-dev libgles-dev
      - name: Install Bootlin aarch64 glibc 2.27 toolchain
        run: |
          curl -fsSL https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--stable-2018.11-1.tar.bz2 | tar -xj -C "$RUNNER_TEMP" &&
          echo "$RUNNER_TEMP/aarch64--glibc--stable-2018.11-1/aarch64-buildroot-linux-gnu/bin" >> "$GITHUB_PATH" &&
          echo "BOOTLIN_CC=$RUNNER_TEMP/aarch64--glibc--stable-2018.11-1/bin/aarch64-linux-gcc -idirafter $GITHUB_WORKSPACE/lib-jpeg-turbo/includes -idirafter /usr/include" >> "$GITHUB_ENV"
      - name: Build aarch64 (ARCHID=32)
        run: make -j4 linux ARCHID=32 CC="$BOOTLIN_CC"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: meshagent-binaries-aarch64
          path: ${{ github.workspace }}/meshagent_aarch64

  # 32-bit Raspberry Pi. Bootlin's armv6-eabihf toolchain defaults to -mcpu=arm1176jzf-s with hard-float VFP,
  # so this armhf binary runs on every 32-bit Pi, Zero/1 (armv6) through 2/3/4 (armv7).
  linux-build-armhf-glibc:
    name: armhf glibc (ARCHID=25, meshagent_armhf, armv6)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.0
      - name: Install Packages
        run: |
          sudo apt clean all && sudo apt update &&
          sudo apt-get install -y libx11-dev libxtst-dev libxext-dev libxrandr-dev libwayland-dev libdrm-dev libegl-dev libgles-dev
      - name: Install Bootlin armv6 hard-float glibc 2.27 toolchain
        run: |
          curl -fsSL https://toolchains.bootlin.com/downloads/releases/toolchains/armv6-eabihf/tarballs/armv6-eabihf--glibc--stable-2018.11-1.tar.bz2 | tar -xj -C "$RUNNER_TEMP" &&
          echo "$RUNNER_TEMP/armv6-eabihf--glibc--stable-2018.11-1/arm-buildroot-linux-gnueabihf/bin" >> "$GITHUB_PATH" &&
          echo "BOOTLIN_CC=$RUNNER_TEMP/armv6-eabihf--glibc--stable-2018.11-1/bin/arm-linux-gcc -idirafter $GITHUB_WORKSPACE/lib-jpeg-turbo/includes -idirafter /usr/include" >> "$GITHUB_ENV"
      - name: Build armhf (ARCHID=25)
        run: make -j4 linux ARCHID=25 CC="$BOOTLIN_CC"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: meshagent-binaries-armhf
          path: ${{ github.workspace }}/meshagent_armhf
