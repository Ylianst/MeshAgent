name: Linux Build
run-name: Build Linux versions of MeshAgent
on: [push]
jobs:
  linux-build-x86:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.0
      - name: Install Packages
        run: |
          sudo dpkg --add-architecture i386 &&
          sudo apt clean all && sudo apt update && 
          sudo apt-get install -y libx11-dev libxtst-dev libxext-dev libjpeg62-dev build-essential &&
          sudo apt-get install -y linux-libc-dev:i386 libc6-dev-i386 libjpeg62-dev:i386 &&
          sudo apt-get install -y libc6-armel-cross libc6-dev-armel-cross binutils-arm-linux-gnueabi libncurses5-dev gcc-arm-linux-gnueabihf &&
          sudo apt-get install -y libxrandr-dev &&
          sudo apt-get install -y libpulse-dev
      # AUDIO=1 enables the Opus/PulseAudio KVM audio path. Only the
      # KVM-enabled targets get it, and only those with a committed
      # lib-opus/linux/$(ARCHNAME)/libopus.a: x86 (5), x86-64 (6), arm64 (26).
      # The NOKVM and Alpine targets below must stay without it.
      #
      # CAMERA=1 enables the V4L2 webcam path on the same KVM-enabled targets.
      # It needs no extra package or library: V4L2 is kernel ioctls via
      # linux/videodev2.h (from libc6-dev, already present), and the JPEG work
      # it does uses the libjpeg-turbo the KVM build already links.
      - name: Build 32 Bit Linux
        run: make -j4 linux ARCHID=5 AUDIO=1 CAMERA=1 && make clean
      - name: Build 64 Bit Linux
        run: make -j4 linux ARCHID=6 AUDIO=1 CAMERA=1 && make clean
      - name: Build 32 Bit NOKVM Linux
        run: make -j4 linux ARCHID=19 && make clean
      - name: Build 64 Bit NOKVM Linux
        run: make -j4 linux ARCHID=20 && make clean
      - name: Build 64 Bit Alpine Linux
        run: make -j4 linux ARCHID=33 && make clean
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meshagent-binaries-x86
          path: ${{ github.workspace }}/meshagent_*

  linux-build-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.0
      - name: Install Packages
        run: |
          sudo apt clean all && sudo apt update &&
          sudo apt-get install -y libx11-dev libxtst-dev libxext-dev libjpeg-dev libxrandr-dev build-essential libpulse-dev
      - name: Build ARM64 Linux
        run: make -j4 linux ARCHID=26 AUDIO=1 CAMERA=1 && make clean
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meshagent-binaries-arm
          path: ${{ github.workspace }}/meshagent_*
