name: "Code scanning - action"

on:
  push:
    branches: [master]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - test/**
      - webrtc/**
      - docs/**
  schedule:
    # Off the full hour, because GitHub delays or drops scheduled runs at :00 under load.
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - test/**
              - webrtc/**
            paths:
              - 'modules/*.js'
              - .github/workflows
      - if: matrix.build-mode == 'manual'
        run: |
          sudo apt-get -qq update && sudo apt-get -qq -y install libx11-dev libxtst-dev libxext-dev libxrandr-dev libwayland-dev libdrm-dev libegl-dev libgles-dev libjpeg62-dev
          make -j4 linux ARCHID=6
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
