name: openssl-linux-native
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha256:
        required: true
        type: string
      force:
        required: true
        type: boolean
      version_suffix:
        required: false
        default: false
        type: boolean

# Keep in sync with openssl/libstatic/linux/openssl-<arch> - a header/archive
# mismatch here is silent ABI drift.
env:
  OSSL_FLAGS: >-
    no-weak-ssl-ciphers no-srp no-psk no-comp no-zlib no-zlib-dynamic
    no-hw no-dso no-shared -no-asm no-rc5 no-idea no-md4
    no-rmd160 no-ssl no-ssl3 no-seed no-camellia no-bf no-cast no-md2
    no-mdc2 no-engine no-ocsp no-cms

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Set (to -<version>) writes this run's archives beside the committed ones
      # instead of overwriting them, so several versions can coexist.
      SFX: ${{ inputs.version_suffix && format('-{0}', inputs.version) || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether all archives already match the requested version
        id: check
        run: |
          skip=true
          for arch in x86-64 x86 poky64; do
            f="openssl/libstatic/linux/$arch/libcrypto${SFX}.a"
            { [ -f "$f" ] && strings "$f" | grep -qF "OpenSSL ${{ inputs.version }} "; } || { skip=false; break; }
          done
          [ "${{ inputs.force }}" = "true" ] && skip=false
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          [ "$skip" = "true" ] && echo "::notice::linux-native archives already at OpenSSL ${{ inputs.version }} and force=false - skipping rebuild."
          true
      - name: Install multilib toolchain
        if: steps.check.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Download and verify source
        if: steps.check.outputs.skip != 'true'
        run: |
          # 1.x releases are tagged OpenSSL_1_1_1w; 3.x and later, openssl-3.5.7.
          case "${{ inputs.version }}" in
            1.*) tag="OpenSSL_$(echo "${{ inputs.version }}" | tr . _)" ;;
            *)   tag="openssl-${{ inputs.version }}" ;;
          esac
          curl -sSL -o ossl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/$tag/openssl-${{ inputs.version }}.tar.gz"
          echo "${{ inputs.sha256 }}  ossl.tar.gz" | sha256sum -c -
      # poky (EOL 2016) intentionally not added: no apt package, no stable URL for
      # its i586-poky-linux-uclibc toolchain.
      - name: Build x86-64 (-O3, asm enabled), x86 (-O3, no-asm), and poky64 (-Os, no-asm, native glibc x86-64 - no cross-compiler needed)
        if: steps.check.outputs.skip != 'true'
        run: |
          for arch in x86-64 x86 poky64; do
            case $arch in
              x86-64) tgt=linux-x86_64; flags="${OSSL_FLAGS/-no-asm/} enable-ec_nistp_64_gcc_128" ;;
              x86)    tgt=linux-x86;    flags="$OSSL_FLAGS" ;;
              poky64) tgt=linux-generic64; flags="$OSSL_FLAGS enable-ec_nistp_64_gcc_128" ;;
            esac
            rm -rf src && mkdir src && tar xzf ossl.tar.gz -C src --strip-components=1
            (
              cd src
              ./Configure $tgt $flags
              [ "$arch" = poky64 ] && sed -i 's/ -O3 / -Os /g' Makefile
              # build_libs only: this repo ships just the two archives, and 3.x's
              # apps/fuzz link pulls 64-bit atomics that 32-bit targets lack.
              make -j"$(nproc)" build_libs
            )
            d=out/openssl/libstatic/linux/$arch
            mkdir -p "$d"
            cp src/libcrypto.a "$d/libcrypto${SFX}.a"
            cp src/libssl.a "$d/libssl${SFX}.a"
          done
      - name: Verify version stamped into archives
        if: steps.check.outputs.skip != 'true'
        run: |
          for f in $(find out -name "libcrypto${SFX}.a"); do
            v=$(strings "$f" | grep -oE 'OpenSSL [0-9]+\.[0-9]+\.[0-9]+[a-z]?' | sort -u | tr '\n' ' ')
            echo "$f -> $v"
            strings "$f" | grep -qF "OpenSSL ${{ inputs.version }} "
          done
      - name: Verify x86-64 has asm objects, x86 does not
        if: steps.check.outputs.skip != 'true'
        run: |
          # x86_64cpuid.o only gets compiled in when asm is enabled - it's the
          # runtime CPU-feature probe the asm paths dispatch on. 3.x prefixes object
          # names (libcrypto-lib-x86_64cpuid.o), so match the tail, not the whole name.
          x64_asm=$(ar t out/openssl/libstatic/linux/x86-64/libcrypto${SFX}.a | grep -cE '(^|-)x86_64cpuid\.o$' || true)
          x86_asm=$(ar t out/openssl/libstatic/linux/x86/libcrypto${SFX}.a | grep -cE '(^|-)x86cpuid\.o$' || true)
          echo "x86-64 asm objects present (expect 1): $x64_asm"
          echo "x86 asm-named objects (expect 0): $x86_asm"
          test "$x64_asm" -eq 1
          test "$x86_asm" -eq 0
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ steps.check.outputs.skip != 'true' }}
        with:
          name: openssl-linux-native
          path: out/
