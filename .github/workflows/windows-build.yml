name: Windows Build

run-name: Build Windows versions of MeshAgent

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.chk.outputs.windows }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A pull request compares against its base branch, a push against the commit before it.
      # A tag gets no base, so a release always builds, also when a moved tag is pushed again.
      - id: chk
        name: Find the builds this change needs
        env:
          BASE_SHA: ${{ github.ref_type != 'tag' && (github.event.pull_request.base.sha || github.event.before) || '' }}
        run: bash .github/scripts/changed-targets.sh "$BASE_SHA"

  windows-build:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    # ARM64 is cross-built here too, so all three platforms come from the same VS 2022 compiler
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86, ARM64]
    steps:
    - uses: actions/checkout@v7
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v3
    - name: Build ${{ matrix.platform }}
      run: msbuild MeshAgent-2022.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }}
    - name: Upload ${{ matrix.platform }} artifacts
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: meshagent-windows-${{ matrix.platform }}
        path: ${{ github.ref_type == 'tag' && 'Release/MeshService*.exe' || 'Release/*.exe' }}
