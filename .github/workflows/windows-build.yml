name: Windows Build

run-name: Build Windows versions of MeshAgent

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: ${{ matrix.platform == 'ARM64' && 'windows-11-arm' || 'windows-2022' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86, ARM64]
    steps:
    - uses: actions/checkout@v7

    # The KVM audio support links libopus. A prebuilt .lib cannot be committed
    # for this, because a static library must be produced by the same toolchain
    # that consumes it: MSVC cannot link a MinGW/GCC archive (it fails with
    # unresolved ___chkstk_ms / __mingw_vfprintf / __memcpy_chk). Building Opus
    # here with the same MSVC that builds the agent keeps the two in step and
    # covers x86, x64 and ARM64 from one definition.
    - name: Cache Opus build
      id: cache-opus
      uses: actions/cache@v4
      with:
        path: lib-opus/windows/${{ matrix.platform == 'x86' && 'x86' || matrix.platform == 'x64' && 'x64' || 'arm64' }}/libopus.lib
        key: opus-1.5.2-${{ matrix.platform }}-msvc-static-v2

    - name: Build Opus with MSVC
      if: steps.cache-opus.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # Keep this in step with the headers vendored in lib-opus/includes.
        $opusVersion = '1.5.2'
        $arch = switch ('${{ matrix.platform }}') {
          'x86'   { 'Win32' }
          'x64'   { 'x64'   }
          'ARM64' { 'ARM64' }
        }
        $outDir = switch ('${{ matrix.platform }}') {
          'x86'   { 'x86'   }
          'x64'   { 'x64'   }
          'ARM64' { 'arm64' }
        }

        Write-Host "Fetching Opus $opusVersion"
        Invoke-WebRequest -Uri "https://downloads.xiph.org/releases/opus/opus-$opusVersion.tar.gz" -OutFile opus.tar.gz
        tar -xzf opus.tar.gz

        # The agent links the STATIC CRT (/MT), so Opus must too. Mixing them
        # makes libopus pull in /DEFAULTLIB:MSVCRT, which on x86 drags in
        # MSVCRT.lib(chandler4gs.obj) and fails with an unresolved
        # __except_handler4_common (x86-only SEH; x64/ARM64 silently tolerate
        # the mismatch, so this must be verified rather than assumed).
        #
        # Opus exposes OPUS_STATIC_RUNTIME for exactly this. Prefer it over
        # CMAKE_MSVC_RUNTIME_LIBRARY, which Opus does not opt into (it needs
        # policy CMP0091 NEW) and which CMake therefore ignores with only a
        # "Manually-specified variables were not used" warning.
        Write-Host "Configuring Opus for $arch (static CRT)"
        cmake -S "opus-$opusVersion" -B opus-build -A $arch `
          -DOPUS_STATIC_RUNTIME=ON `
          -DOPUS_BUILD_SHARED_LIBRARY=OFF `
          -DOPUS_BUILD_TESTING=OFF `
          -DOPUS_BUILD_PROGRAMS=OFF
        if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }

        # CMake only warns when an option is unknown, so confirm it was applied
        # rather than trusting the command line.
        $cached = & cmake -L opus-build 2>$null | Select-String 'OPUS_STATIC_RUNTIME'
        Write-Host "cache: $cached"
        if ($cached -notmatch '=ON') { throw "OPUS_STATIC_RUNTIME was not applied" }

        cmake --build opus-build --config Release --parallel
        if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

        $built = Get-ChildItem -Path opus-build -Recurse -Filter opus.lib |
                 Where-Object { $_.FullName -match 'Release' } |
                 Select-Object -First 1
        if (-not $built) { throw "opus.lib was not produced" }

        # Fail loudly here rather than at link time: if Opus ended up on the
        # dynamic CRT it will carry a DEFAULTLIB directive naming MSVCRT.
        $dumpbin = @("${env:ProgramFiles}\Microsoft Visual Studio\2022",
                     "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022") |
                   Where-Object { Test-Path $_ } |
                   ForEach-Object { Get-ChildItem $_ -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue } |
                   Select-Object -First 1
        if (-not $dumpbin) { throw "dumpbin.exe not found; cannot verify the CRT" }

        $directives = & $dumpbin.FullName /directives $built.FullName 2>$null
        # LIBCMT = static CRT (what we want); MSVCRT = dynamic CRT (what breaks
        # the x86 link with an unresolved __except_handler4_common).
        if ($directives -match '/DEFAULTLIB:"?MSVCRT') {
          throw "Opus was built against the dynamic CRT (/MD); the agent needs /MT"
        }
        if ($directives -notmatch '/DEFAULTLIB:"?LIBCMT') {
          throw "Opus does not reference the static CRT (LIBCMT); refusing to ship it"
        }
        Write-Host "Verified: Opus uses the static CRT (LIBCMT)"

        New-Item -ItemType Directory -Force -Path "lib-opus/windows/$outDir" | Out-Null
        Copy-Item $built.FullName "lib-opus/windows/$outDir/libopus.lib" -Force
        Write-Host "Installed lib-opus/windows/$outDir/libopus.lib ($([math]::Round($built.Length/1KB)) KB)"

    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v3

    - name: Build ${{ matrix.platform }}
      run: msbuild MeshAgent-2022.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }}

    - name: Upload ${{ matrix.platform }} artifacts
      uses: actions/upload-artifact@v7
      with:
        name: meshagent-windows-${{ matrix.platform }}
        path: Release/*.exe
